name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-test-sign-notarize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # Ohne hinterlegte Schlüssel ist kein signierter Build möglich. Das ist
      # kein Fehler, sondern ein Zustand: Dann wird unsigniert gebaut und
      # veröffentlicht, statt den Lauf abzubrechen. Vorher scheiterte jeder
      # Release nach zwölf Sekunden am Import eines Zertifikats, das es nicht
      # gibt — und die Veröffentlichung musste von Hand nachgeholt werden.
      - name: Check signing secrets
        id: check
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
        run: |
          if [ -n "$CERTIFICATE_P12" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — building a signed and notarized app."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building an unsigned app."
          fi

      - name: Import Developer ID certificate
        if: steps.check.outputs.signed == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Resolve dependencies and test
        run: |
          swift package resolve
          swift test -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

      # Immer ein Release-Build. Fehlt die Apple-Signatur, warnt macOS beim
      # ersten Oeffnen — die App kann sich aber trotzdem aktualisieren, denn
      # dafuer buergt der Sparkle-Schluessel. Frueher wurde ohne Zertifikat ein
      # Entwicklungs-Build veroeffentlicht, und der schaltet Updates von sich aus ab.
      - name: Build app
        env:
          BUILD_CONFIGURATION: release
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          SPARKLE_FEED_URL: ${{ secrets.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: ./build.sh

      - name: Notarize and staple
        if: steps.check.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          ditto -c -k --keepParent Folder.app Folder-notarization.zip
          xcrun notarytool submit Folder-notarization.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$DEVELOPMENT_TEAM" --wait
          xcrun stapler staple Folder.app
          spctl --assess --type execute --verbose=4 Folder.app

      - name: Package archive
        run: |
          mkdir -p releases
          ditto -c -k --keepParent --sequesterRsrc Folder.app releases/Folder.app.zip

      # Der Appcast ist Sparkles Update-Verzeichnis: Er sagt der installierten
      # App, welche Version es gibt und wo sie liegt. Seine Signatur haengt am
      # Sparkle-Schluessel, nicht an Apple — deshalb entsteht er auch ohne
      # Zertifikat, sobald der private Schluessel hinterlegt ist.
      - name: Sign archive and generate appcast
        if: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          GENERATE_APPCAST=$(find .build -type f -name generate_appcast -print -quit)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - --download-url-prefix "$DOWNLOAD_PREFIX" releases
          echo "appcast:"; cat releases/appcast.xml | head -20

      - name: Compose release notes
        id: notes
        run: |
          if [ "${{ steps.check.outputs.signed }}" = "true" ]; then
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'body<<NOTE'
              echo '## Install'
              echo
              echo '1. Download `Folder.app.zip` below.'
              echo '2. Unzip it and drag `Folder.app` to `/Applications`.'
              echo '3. Open Folder.'
              echo
              echo '> This package is built without an Apple signature, because the'
              echo '> signing secrets are not configured for this repository. macOS'
              echo '> may ask for confirmation the first time it is opened.'
              echo 'NOTE'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
