name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-test-sign-notarize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Resolve dependencies and test
        run: |
          swift package resolve
          swift test -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

      - name: Build signed app
        env:
          BUILD_CONFIGURATION: release
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          SPARKLE_FEED_URL: ${{ secrets.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: ./build.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_APP_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          ditto -c -k --keepParent Folder.app Folder-notarization.zip
          xcrun notarytool submit Folder-notarization.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$DEVELOPMENT_TEAM" --wait
          xcrun stapler staple Folder.app
          spctl --assess --type execute --verbose=4 Folder.app

      - name: Package Sparkle archive
        run: ditto -c -k --keepParent Folder.app Folder.app.zip

      - name: Sign archive and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir releases
          mv Folder.app.zip releases/
          GENERATE_APPCAST=$(find .build -type f -name generate_appcast -print -quit)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" --ed-key-file - releases

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/Folder.app.zip
            releases/appcast.xml
          generate_release_notes: true
